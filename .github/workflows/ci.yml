name: CloudRDR CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Quality (Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Test Environment Config
        run: cp .env.example .env

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Run Static Analysis (ESLint)
        run: npm run lint

  test-matrix:
    name: Test Suite (${{ matrix.os }} - Node ${{ matrix.node-version }})
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Environment File (POSIX)
        if: runner.os != 'Windows'
        run: cp .env.example .env

      - name: Create Environment File (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item .env.example .env

      - name: Run Unit & Integration Tests (node:test)
        run: npm test

      - name: Execute End-to-End Attack & Verified Recovery Simulation
        run: npm run simulate

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Run Security Audit
        run: npm audit --audit-level=critical
