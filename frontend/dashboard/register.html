<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operator Registration — CloudRDR Security Operations</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/dashboard/css/tokens.css" />
    <link rel="stylesheet" href="/dashboard/css/styles.css" />
  <body class="auth-page-canvas">
    <a
      href="/"
      style="
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text-muted);
        font-size: 0.78rem;
        text-decoration: none;
        margin-bottom: 20px;
        transition: color var(--dur-fast) var(--ease);
      "
      onmouseover="this.style.color='var(--text-primary)'"
      onmouseout="this.style.color='var(--text-muted)'"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      <span>Back to CloudRDR Overview</span>
    </a>

    <div class="auth-double-bezel">
      <div class="auth-card-core">
      <div class="auth-card-header">
        <a
          href="/"
          class="auth-brand-logo"
          title="Back to CloudRDR Overview"
          style="
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            gap: 8px;
          "
        >
          <svg width="56" height="56" viewBox="0 0 240 240" style="flex-shrink: 0">
            <defs>
              <linearGradient id="reg_tfD" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38BDF8" />
                <stop offset="100%" stop-color="#0284C7" />
              </linearGradient>
              <linearGradient id="reg_lfD" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#0284C7" />
                <stop offset="100%" stop-color="#1E3A8A" />
              </linearGradient>
              <linearGradient id="reg_rfD" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10B981" />
                <stop offset="100%" stop-color="#047857" />
              </linearGradient>
              <linearGradient id="reg_rgD" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38BDF8" />
                <stop offset="50%" stop-color="#6366F1" />
                <stop offset="100%" stop-color="#10B981" />
              </linearGradient>
            </defs>
            <g transform="translate(120, 124)">
              <path
                d="M 65,-55 A 85,85 0 1,0 75,40"
                fill="none"
                stroke="url(#reg_rgD)"
                stroke-width="12"
                stroke-linecap="round"
              />
              <polygon points="84,22 86,52 58,42" fill="#10B981" />
              <circle
                cx="0"
                cy="0"
                r="66"
                fill="none"
                stroke="var(--border)"
                stroke-width="2.5"
                stroke-dasharray="3 6"
              />
              <path
                d="M -22,-25 V -44 A 22,22 0 0,1 22,-44 V -25"
                fill="none"
                stroke="#E2E8F0"
                stroke-width="9"
                stroke-linecap="round"
              />
              <polygon points="0,-42 42,-18 0,6 -42,-18" fill="url(#reg_tfD)" />
              <polygon points="-42,-18 0,6 0,54 -42,30" fill="url(#reg_lfD)" />
              <polygon points="0,6 42,-18 42,30 0,54" fill="url(#reg_rfD)" />
              <polyline
                points="-20,-18 0,-30 20,-18"
                fill="none"
                stroke="#FFFFFF"
                stroke-width="3.5"
                stroke-linecap="round"
              />
              <line
                x1="0"
                y1="6"
                x2="0"
                y2="36"
                stroke="#FFFFFF"
                stroke-width="3.5"
                stroke-linecap="round"
              />
              <circle cx="0" cy="6" r="6" fill="#FFFFFF" />
              <circle cx="0" cy="-30" r="4.5" fill="#FFFFFF" />
              <circle cx="-20" cy="-18" r="4.5" fill="#FFFFFF" />
              <circle cx="20" cy="-18" r="4.5" fill="#FFFFFF" />
            </g>
          </svg>
          <span
            style="
              font-size: 1.55rem;
              font-weight: 800;
              color: var(--text-primary);
              letter-spacing: -0.5px;
            "
            >Cloud<span style="color: #38bdf8">R</span><span style="color: #0ea5e9">D</span
            ><span style="color: #10b981">R</span></span
          >
        </a>
        <h1 class="auth-title" style="margin-top: 6px">Register Account</h1>
        <p class="auth-subtitle">Cloud Ransomware Detection &amp; Recovery</p>
      </div>

      <!-- Feedback alert box -->
      <div id="authAlert" class="auth-alert" role="alert" aria-live="assertive">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          style="flex-shrink: 0; margin-top: 1px"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span id="authAlertText">Registration error message</span>
      </div>

      <form id="registerForm" class="auth-form" novalidate>
        <!-- Full Name -->
        <div class="form-group">
          <label for="fullNameInput" class="form-label">Full Name</label>
          <div class="form-input-wrapper">
            <span class="form-input-icon" aria-hidden="true">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input
              type="text"
              id="fullNameInput"
              name="fullName"
              class="form-input"
              placeholder="Sarah Connor"
              autocomplete="name"
              required
              aria-required="true"
              aria-describedby="fullNameError"
            />
          </div>
          <div id="fullNameError" class="form-field-error" role="status" aria-live="polite"></div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="emailInput" class="form-label">Email Address</label>
          <div class="form-input-wrapper">
            <span class="form-input-icon" aria-hidden="true">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <rect width="20" height="16" x="2" y="4" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L1 7" />
              </svg>
            </span>
            <input
              type="email"
              id="emailInput"
              name="email"
              class="form-input"
              placeholder="s.connor@cloudrdr.internal"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="emailError"
            />
          </div>
          <div id="emailError" class="form-field-error" role="status" aria-live="polite"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <div class="form-label">
            <label for="passwordInput">Password</label>
            <span style="font-size: 0.7rem; color: var(--text-muted)">Min. 8 characters</span>
          </div>
          <div class="form-input-wrapper">
            <span class="form-input-icon" aria-hidden="true">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input
              type="password"
              id="passwordInput"
              name="password"
              class="form-input has-toggle"
              placeholder="••••••••••••"
              autocomplete="new-password"
              required
              aria-required="true"
              aria-describedby="passwordError"
            />
            <button
              type="button"
              id="togglePasswordBtn"
              class="form-toggle-pwd"
              aria-label="Toggle password visibility"
              title="Show password"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <!-- Password Strength Meter -->
          <div class="pwd-strength-container" id="pwdStrengthWrap" style="display: none">
            <div class="pwd-strength-bar">
              <div class="pwd-strength-segment" id="pwdSeg1"></div>
              <div class="pwd-strength-segment" id="pwdSeg2"></div>
              <div class="pwd-strength-segment" id="pwdSeg3"></div>
            </div>
            <div class="pwd-strength-label">
              <span
                >Strength:
                <strong id="pwdStrengthText" style="color: var(--text-secondary)"
                  >Weak</strong
                ></span
              >
              <span>Letters + numbers or symbols</span>
            </div>
          </div>
          <div id="passwordError" class="form-field-error"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPasswordInput" class="form-label">Confirm Password</label>
          <div class="form-input-wrapper">
            <span class="form-input-icon">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
            </span>
            <input
              type="password"
              id="confirmPasswordInput"
              name="confirmPassword"
              class="form-input"
              placeholder="••••••••••••"
              autocomplete="new-password"
              required
              aria-required="true"
            />
          </div>
          <div id="confirmPasswordError" class="form-field-error"></div>
        </div>

        <!-- Submit button -->
        <button type="submit" id="submitBtn" class="btn-auth-submit">
          <span id="btnText">Create Account</span>
          <svg
            id="btnSpinner"
            class="anim-spin"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            style="display: none"
          >
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
        </button>
      </form>

      <div class="auth-card-footer">
        Already have an account? <a href="/login" id="toLoginLink">Sign In</a>
      </div>
    </div>
  </div>

    <script type="module">
      const form = document.getElementById('registerForm');
      const fullNameInput = document.getElementById('fullNameInput');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const confirmPasswordInput = document.getElementById('confirmPasswordInput');

      const fullNameError = document.getElementById('fullNameError');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');
      const confirmPasswordError = document.getElementById('confirmPasswordError');

      const alertBox = document.getElementById('authAlert');
      const alertText = document.getElementById('authAlertText');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const togglePwdBtn = document.getElementById('togglePasswordBtn');

      const pwdStrengthWrap = document.getElementById('pwdStrengthWrap');
      const pwdSeg1 = document.getElementById('pwdSeg1');
      const pwdSeg2 = document.getElementById('pwdSeg2');
      const pwdSeg3 = document.getElementById('pwdSeg3');
      const pwdStrengthText = document.getElementById('pwdStrengthText');

      // Toggle password visibility
      togglePwdBtn?.addEventListener('click', () => {
        const isPwd = passwordInput.type === 'password';
        passwordInput.type = isPwd ? 'text' : 'password';
        confirmPasswordInput.type = isPwd ? 'text' : 'password';
        togglePwdBtn.title = isPwd ? 'Hide passwords' : 'Show passwords';
      });

      // Real-time password strength meter
      passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        if (!val) {
          pwdStrengthWrap.style.display = 'none';
          return;
        }
        pwdStrengthWrap.style.display = 'flex';

        let score = 0;
        if (val.length >= 8) score++;
        if (/[a-zA-Z]/.test(val) && /[\d!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?]/.test(val)) score++;
        if (
          val.length >= 12 &&
          /[A-Z]/.test(val) &&
          /[a-z]/.test(val) &&
          /[\d]/.test(val) &&
          /[^A-Za-z0-9]/.test(val)
        )
          score++;

        pwdSeg1.className = 'pwd-strength-segment';
        pwdSeg2.className = 'pwd-strength-segment';
        pwdSeg3.className = 'pwd-strength-segment';

        if (score === 1) {
          pwdSeg1.classList.add('active-weak');
          pwdStrengthText.textContent = 'Weak';
          pwdStrengthText.style.color = 'var(--threat-red-text)';
        } else if (score === 2) {
          pwdSeg1.classList.add('active-medium');
          pwdSeg2.classList.add('active-medium');
          pwdStrengthText.textContent = 'Medium';
          pwdStrengthText.style.color = 'var(--warning-amber-text)';
        } else if (score >= 3) {
          pwdSeg1.classList.add('active-strong');
          pwdSeg2.classList.add('active-strong');
          pwdSeg3.classList.add('active-strong');
          pwdStrengthText.textContent = 'Strong';
          pwdStrengthText.style.color = 'var(--healthy-green-text)';
        }
      });

      function showAlert(msg, isSuccess = false) {
        alertText.innerHTML = msg;
        alertBox.className = `auth-alert show ${isSuccess ? 'success' : 'error'}`;
      }

      function clearErrors() {
        alertBox.className = 'auth-alert';
        fullNameError.textContent = '';
        emailError.textContent = '';
        passwordError.textContent = '';
        confirmPasswordError.textContent = '';
        fullNameInput.classList.remove('is-invalid');
        emailInput.classList.remove('is-invalid');
        passwordInput.classList.remove('is-invalid');
        confirmPasswordInput.classList.remove('is-invalid');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const fullName = fullNameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        let hasError = false;

        if (!fullName || fullName.length < 2) {
          fullNameError.textContent = 'Please provide your full name (minimum 2 characters).';
          fullNameInput.classList.add('is-invalid');
          hasError = true;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          emailError.textContent = 'Please enter a valid internal email address.';
          emailInput.classList.add('is-invalid');
          hasError = true;
        }

        if (!password || password.length < 8) {
          passwordError.textContent = 'Password must be at least 8 characters long.';
          passwordInput.classList.add('is-invalid');
          hasError = true;
        } else if (!(
          /[a-zA-Z]/.test(password) && /[\d!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?]/.test(password)
        )) {
          passwordError.textContent =
            'Password must contain at least one letter and one number or symbol.';
          passwordInput.classList.add('is-invalid');
          hasError = true;
        }

        if (password !== confirmPassword) {
          confirmPasswordError.textContent = 'Passwords do not match.';
          confirmPasswordInput.classList.add('is-invalid');
          hasError = true;
        }

        if (hasError) return;

        // Loading state
        submitBtn.disabled = true;
        btnText.textContent = 'Creating Account...';
        btnSpinner.style.display = 'inline-block';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ fullName, email, password, confirmPassword }),
          });

          const data = await res.json();

          if (!res.ok) {
            let msg = data.error?.message || 'Registration failed. Please check your details.';
            if (msg.includes('already exists')) {
              msg += ` <a href="/login?email=${encodeURIComponent(email)}" style="color:var(--accent-cyan);text-decoration:underline;font-weight:600;margin-left:6px;">Sign In Here &rarr;</a>`;
            }
            showAlert(msg);
            return;
          }

          showAlert('Account registered successfully! Redirecting to SOC dashboard...', true);

          // Store user in localStorage for immediate client hydration
          if (data.user) {
            localStorage.setItem('cloudrdr_user', JSON.stringify(data.user));
            if (data.token) localStorage.setItem('cloudrdr_token', data.token);
          }

          const urlParams = new URLSearchParams(window.location.search);
          const destination = urlParams.get('redirect') || '/dashboard';

          setTimeout(() => {
            window.location.href = destination;
          }, 350);
        } catch (err) {
          showAlert('Network or server connection error. Please try again.');
        } finally {
          submitBtn.disabled = false;
          btnText.textContent = 'Create Account & Access Dashboard';
          btnSpinner.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
